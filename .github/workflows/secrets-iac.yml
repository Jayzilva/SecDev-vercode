# Secrets + IaC scanning.
# Gitleaks: hard-coded credentials anywhere in git history.
# Checkov / Trivy config: misconfiguration in Dockerfile and Terraform.
name: Secrets and IaC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  CHECKOV_IMAGE: bridgecrew/checkov:3.4.5
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: a secret deleted later is still leaked
      - name: Scan git history
        run: |
          mkdir -p scan-results
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact \
              --report-format sarif --report-path /repo/scan-results/gitleaks.sarif --exit-code 0
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: scan-results/gitleaks.sarif
          category: gitleaks

  checkov:
    name: Checkov (Dockerfile + Terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Checkov
        run: |
          mkdir -p scan-results
          docker run --rm -v "$PWD:/src" -w /src "$CHECKOV_IMAGE" \
            -d /src --framework dockerfile terraform --soft-fail \
            -o cli -o sarif --output-file-path console,/src/scan-results/checkov.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: scan-results/checkov.sarif
          category: checkov

  trivy-config:
    name: Trivy config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy misconfiguration scan
        run: |
          mkdir -p scan-results
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --format sarif --output scan-results/trivy-config.sarif .
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: scan-results/trivy-config.sarif
          category: trivy-config
