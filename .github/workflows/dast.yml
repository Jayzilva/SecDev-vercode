# DAST — Dynamic Application Security Testing.
# Starts the app inside the runner and attacks it over HTTP with OWASP ZAP.
# The app is only reachable from inside this ephemeral runner.
name: DAST

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0

jobs:
  zap:
    name: OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start VulnApp
        run: |
          docker build -t vulnapp:ci .
          docker run -d --name vulnapp -p 127.0.0.1:8080:8080 vulnapp:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/openapi/v1.json >/dev/null

      - name: Prepare ZAP work dir
        run: mkdir -p zap && chmod 777 zap

      # Baseline = spider + passive checks only (headers, cookies, info leaks). Safe, fast.
      - name: ZAP baseline scan
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:8080/ -I \
              -r baseline.html -J baseline.json

      # API scan = imports the OpenAPI spec and runs ACTIVE attacks (SQLi, XSS, path traversal ...).
      - name: ZAP API scan (active)
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t http://127.0.0.1:8080/openapi/v1.json -f openapi -I \
              -r api.html -J api.json

      - name: Summary
        if: always()
        run: |
          for f in zap/baseline.json zap/api.json; do
            [ -f "$f" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.site[].alerts[] | "- **\(.riskdesc)** \(.alert) (CWE-\(.cweid))"' "$f" | sort -u >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-reports
          path: zap/

      - name: Stop app
        if: always()
        run: docker rm -f vulnapp || true
