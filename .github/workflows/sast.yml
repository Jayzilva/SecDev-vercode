# SAST — Static Application Security Testing.
# Reads source code (no running app) and traces untrusted input to dangerous sinks.
# Three engines side-by-side so you can compare coverage: CodeQL, Semgrep, Roslyn analyzers.
name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0

jobs:
  codeql:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended     # broader than the default suite
      - run: dotnet build src/VulnApp/VulnApp.csproj -c Release
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql-csharp

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep (community rules, no login needed)
        run: |
          mkdir -p scan-results
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off \
              --config p/csharp --config p/owasp-top-ten --config p/secrets \
              --sarif --output scan-results/semgrep.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: scan-results/semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-sarif
          path: scan-results/semgrep.sarif

  roslyn:
    name: Roslyn security analyzers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build with SARIF error log
        # Rules enabled in .editorconfig (CA2100, CA2326/2327, CA3xxx, CA5351 ...)
        run: |
          mkdir -p scan-results
          dotnet build src/VulnApp/VulnApp.csproj -c Release \
            "-p:ErrorLog=$PWD/scan-results/roslyn.sarif%2Cversion=2.1"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: scan-results/roslyn.sarif
          category: roslyn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: roslyn-sarif
          path: scan-results/roslyn.sarif
